<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | NOVA Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <span class="logo-icon">✦</span> NOVA
            </a>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access your account & orders</p>
        </div>

        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.4rem;">
                    <label for="password" style="margin-bottom:0;">Password</label>
                    <a href="#" style="font-size:0.8rem; color:var(--primary); text-decoration:none;">Forgot password?</a>
                </div>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem;">
                <input type="checkbox" id="remember" style="accent-color: var(--primary); cursor: pointer;">
                <label for="remember" style="margin-bottom: 0; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">Remember this device</label>
            </div>

            <button type="submit" class="btn btn-primary auth-submit-btn">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html" class="auth-link">Create one</a></p>
            <a href="index.html" class="back-home-link">&larr; Return to Store</a>
        </div>
    </div>
</body>
</html>
