<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-commerce Landing Page</title>
    <style>
        * { font-family: Arial, sans-serif; }
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #007BFF;
            padding: 1rem;
            text-align: center;
        }
        .hero {
            background-image: url('https://via.placeholder.com/800x400?text=E-commerce&i=red');
            background-size: cover;
            padding: 2rem;
        }
        .hero h1 {
            color: #007BFF;
        }
        .cta-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .cta-btn:hover {
            background-color: #005F9A;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
<header>
<h1>E-commerce Landing Page</h1>
</header>
<div class="hero">
<h1>Discover the Future of Shopping</h1>
<button class="cta-btn">Start Shopping Now</button>
</div>
<div class="product-section">
<div class="product-card" data-id="1">
    <img src="https://via.placeholder.com/400x200?text=Product 1&i=red" alt="Product 1">
    <h3>Product 1</h3>
    <p>Our latest product with great features.</p>
</div>
<div class="product-card" data-id="2">
    <img src="https://via.placeholder.com/400x200?text=Product 2&i=red" alt="Product 2">
    <h3>Product 2</h3>
    <p>Another great product with unique features.</p>
</div>
<div class="product-card" data-id="3">
    <img src="https://via.placeholder.com/400x200?text=Product 3&i=red" alt="Product 3">
    <h3>Product 3</h3>
    <p>Our latest product with great features.</p>
</div>
</div>
<footer>
<p>&copy; 2023 E-commerce Landing Page. All rights reserved.</p>
<div style='margin-top: 2rem; text-align: center;'>
    <a href='login.html' style='margin: 0 1rem; color: #007BFF; text-decoration: none;'>Login</a>
    <a href='register.html' style='margin: 0 1rem; color: #007BFF; text-decoration: none;'>Register</a>
</div>
</footer>
</body>
</html>
