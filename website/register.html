<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | NOVA Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <span class="logo-icon">✦</span> NOVA
            </a>
            <h2>Create an Account</h2>
            <p>Join Nova for free shipping, warranty benefits & perks</p>
        </div>

        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" class="form-input" placeholder="Alex Johnson" required>
            </div>

            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" class="form-input" placeholder="Create a strong password" required minlength="6">
            </div>

            <div style="display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 1.25rem;">
                <input type="checkbox" id="terms" required style="accent-color: var(--primary); margin-top: 3px; cursor: pointer;">
                <label for="terms" style="margin-bottom: 0; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; cursor: pointer;">
                    I agree to Nova's Terms of Service and Privacy Policy
                </label>
            </div>

            <button type="submit" class="btn btn-primary auth-submit-btn">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html" class="auth-link">Sign in here</a></p>
            <a href="index.html" class="back-home-link">&larr; Return to Store</a>
        </div>
    </div>
</body>
</html>
